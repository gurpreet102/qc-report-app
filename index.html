</head>

        <button type="button" class="lang-btn" id="btn-lang-hi" onclick="switchLanguage('hi')">हिन्दी</button>
    </div>
</header>

<div class="container">

        </div>

    <div class="card general-feedback-box">

        <textarea id="general_feedback" placeholder="..."></textarea>

</div>

<div class="footer-bar">
    <div class="footer-btn-container">
        <div class="secondary-actions" id="secondary-actions-group">

        <div class="btn-generate-wrapper">
            <button type="button" class="action-btn" id="generate-btn">Generate Report</button>
            <button type="button" class="action-btn btn-new-audit" id="new-audit-btn" onclick="startNewAudit()">➕ Start New Audit</button>
        </div>
    </div>
    <div class="draft-status-bar" id="draft-status-msg"></div>
</div>

<div class="modal-overlay" id="modal">

        <div class="modal-body" id="report-text"></div>
        <div class="modal-footer">
            <div class="modal-btn-row">

            </div>
            <div class="modal-btn-row">

                <button type="button" class="modal-btn btn-close" id="btn-close">Close</button>
            </div>
        </div>
    </div>
</div>

function renderChecklist() {
    const root = document.getElementById('checklist-root');
    let html = '';

    const currentSelections = {};
    const currentRemarks = {};
    document.querySelectorAll('.check-card').forEach(card => {
        const id = card.id;
        const status = card.getAttribute('data-status');
        if (status) currentSelections[id] = status;
        const remark = card.querySelector('textarea')?.value;
        if (remark) currentRemarks[id] = remark;
    });

    AUDIT_DATA.forEach((sec, sIdx) => {
        const catTitle = sec.category[currentLang];
        const isTaste = !!sec.isTasteCategory;

        html += `
            <div class="section-header">
                <span class="section-title">${catTitle}</span>
                <span class="section-badge">${sec.items.length} ${UI_TEXT[currentLang].itemsLabel}</span>
            </div>
        `;

        sec.items.forEach((itemObj, iIdx) => {
            const uniqueId = `item_${sIdx}_${iIdx}`;
            const itemText = itemObj[currentLang];
            const itemTextEn = itemObj.en;
            const catEn = sec.category.en;

            html += `
                <div class="check-card" 
                     id="${uniqueId}" 
                     data-cat="${catTitle}" 
                     data-cat-en="${catEn}" 
                     data-text="${itemText}" 
                     data-text-en="${itemTextEn}" 
                     data-is-taste="${isTaste}">
                    <div class="check-title">${itemText}</div>
                    <div class="btn-group">
                        <button type="button" class="status-btn btn-ok" onclick="setStatus('${uniqueId}', 'OK')">${UI_TEXT[currentLang].btnOk}</button>
                        <button type="button" class="status-btn btn-notok" onclick="setStatus('${uniqueId}', 'Not OK')">${UI_TEXT[currentLang].btnNotOk}</button>
                        ${isTaste ? `<button type="button" class="status-btn btn-na" onclick="setStatus('${uniqueId}', 'Not Available')">${UI_TEXT[currentLang].btnNa}</button>` : ''}
                    </div>
                    <div class="remarks-box">
                        <textarea placeholder="${UI_TEXT[currentLang].remarkPlaceholder}"></textarea>
                    </div>
                </div>
            `;
        });
    });

    root.innerHTML = html;

    for (const id in currentSelections) {
        const card = document.getElementById(id);
        if (card) {
            setStatus(id, currentSelections[id]);
            if (currentRemarks[id]) {
                const ta = card.querySelector('textarea');
                if (ta) ta.value = currentRemarks[id];
            }
        }
    }
}

function setStatus(cardId, status) {
    const card = document.getElementById(cardId);
    if (!card) return;

    if (card.getAttribute('data-locked') === 'true') return;

    card.classList.remove('card-error');

    const btnOk = card.querySelector('.btn-ok');
    const btnNotOk = card.querySelector('.btn-notok');
    const btnNa = card.querySelector('.btn-na');
    const remarksBox = card.querySelector('.remarks-box');

    const currentStatus = card.getAttribute('data-status');

    if (status === currentStatus) {
        card.removeAttribute('data-status');
        if (btnOk) btnOk.classList.remove('selected-ok');
        if (btnNotOk) btnNotOk.classList.remove('selected-not-ok');
        if (btnNa) btnNa.classList.remove('selected-na');
        if (remarksBox) remarksBox.style.display = 'none';
        saveDraft(true);
        return;
    }

    card.setAttribute('data-status', status);

    if (btnOk) btnOk.classList.toggle('selected-ok', status === 'OK');
    if (btnNotOk) btnNotOk.classList.toggle('selected-not-ok', status === 'Not OK');
    if (btnNa) btnNa.classList.toggle('selected-na', status === 'Not Available');

    if (remarksBox) {
        remarksBox.style.display = (status === 'Not OK') ? 'block' : 'none';
    }

    saveDraft(true);
}

function saveDraft(silent = true) {
    const draftData = {
        sewadar: document.getElementById('sewadar_name')?.value || '',
        canteen: document.getElementById('canteen_location')?.value || '',
        dic: isVisitMode ? '' : (document.getElementById('dic_name')?.value || ''),
        slot: isVisitMode ? (document.getElementById('slot_selection')?.value || '') : '',
        generalFeedback: document.getElementById('general_feedback')?.value || '',
        selections: {},
        remarks: {}
    };

    document.querySelectorAll('.check-card').forEach(card => {
        const status = card.getAttribute('data-status');
        if (status) draftData.selections[card.id] = status;

        const remark = card.querySelector('textarea')?.value;
        if (remark) draftData.remarks[card.id] = remark;
    });

    localStorage.setItem(DRAFT_KEY, JSON.stringify(draftData));

    if (!silent) {
        const msgEl = document.getElementById('draft-status-msg');
        msgEl.innerText = UI_TEXT[currentLang].draftSavedMsg + new Date().toLocaleTimeString();
        setTimeout(() => { msgEl.innerText = ""; }, 3000);
    }
}

function manualSaveDraft() {
    saveDraft(false);
}

function clearForm() {
    if (!confirm(UI_TEXT[currentLang].clearConfirmMsg)) return;

    localStorage.removeItem(DRAFT_KEY);

    const fieldsToClear = ['sewadar_name', 'canteen_location', 'general_feedback'];
    if (isVisitMode) {
        fieldsToClear.push('slot_selection');
    } else {
        fieldsToClear.push('dic_name');
    }

    fieldsToClear.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.value = '';
            el.classList.remove('input-error');
        }
    });

    document.querySelectorAll('.check-card').forEach(card => {
        card.removeAttribute('data-status');
        card.classList.remove('card-error');

        const btnOk = card.querySelector('.btn-ok');
        const btnNotOk = card.querySelector('.btn-notok');
        const btnNa = card.querySelector('.btn-na');
        const remarksBox = card.querySelector('.remarks-box');
        const ta = card.querySelector('textarea');

        if (btnOk) btnOk.classList.remove('selected-ok');
        if (btnNotOk) btnNotOk.classList.remove('selected-not-ok');
        if (btnNa) btnNa.classList.remove('selected-na');
        if (remarksBox) remarksBox.style.display = 'none';
        if (ta) {
            ta.value = '';
            ta.classList.remove('input-error');

    });

    const msgEl = document.getElementById('draft-status-msg');
    msgEl.innerText = UI_TEXT[currentLang].formClearedMsg;
    setTimeout(() => { msgEl.innerText = ""; }, 3000);
    window.scrollTo({ top: 0, behavior: 'smooth' });

function loadDraft() {
    const saved = localStorage.getItem(DRAFT_KEY);
    if (!saved) return;

    try {
        const draft = JSON.parse(saved);

        if (draft.sewadar) document.getElementById('sewadar_name').value = draft.sewadar;
        if (draft.canteen) document.getElementById('canteen_location').value = draft.canteen;
        if (isVisitMode) {
            if (draft.slot) document.getElementById('slot_selection').value = draft.slot;
        } else {
            if (draft.dic) document.getElementById('dic_name').value = draft.dic;
        }
        if (draft.generalFeedback) document.getElementById('general_feedback').value = draft.generalFeedback;

        if (draft.selections) {
            Object.keys(draft.selections).forEach(id => {
                setStatus(id, draft.selections[id]);
            });
        }

        if (draft.remarks) {
            Object.keys(draft.remarks).forEach(id => {
                const card = document.getElementById(id);
                if (card) {
                    const ta = card.querySelector('textarea');
                    if (ta) ta.value = draft.remarks[id];
                }
            });
        }
    } catch (e) {
        console.error("Failed loading draft:", e);
    }
}

function attachAutoSaveListeners() {
    const idsToWatch = ['sewadar_name', 'canteen_location', 'general_feedback'];
    if (isVisitMode) {
        idsToWatch.push('slot_selection');
    } else {
        idsToWatch.push('dic_name');
    }

    idsToWatch.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', () => saveDraft(true));
            el.addEventListener('change', () => saveDraft(true));
        }
    });

    document.querySelectorAll('.check-card textarea').forEach(ta => {
        ta.addEventListener('input', () => saveDraft(true));
    });
}

function validateForm() {
    let isValid = true;
    let firstErrorElement = null;

    const sewadarEl = document.getElementById('sewadar_name');
    const canteenEl = document.getElementById('canteen_location');
    const requiredHeaderElements = [sewadarEl, canteenEl];

    if (isVisitMode) {
        requiredHeaderElements.push(document.getElementById('slot_selection'));
    } else {
        requiredHeaderElements.push(document.getElementById('dic_name'));
    }

    requiredHeaderElements.forEach(el => {
        if (!el || !el.value.trim()) {
            if (el) el.classList.add('input-error');
            isValid = false;
            if (!firstErrorElement) firstErrorElement = el;
        } else {
            el.classList.remove('input-error');
        }
    });

    const allCards = document.querySelectorAll('.check-card');
    allCards.forEach(card => {
        const status = card.getAttribute('data-status');
        const textarea = card.querySelector('textarea');
        if (textarea) textarea.classList.remove('input-error');
        card.classList.remove('card-error');

        if (!status) {
            card.classList.add('card-error');
            isValid = false;
            if (!firstErrorElement) firstErrorElement = card;
        } else if (status === 'Not OK' && textarea && !textarea.value.trim()) {
            textarea.classList.add('input-error');
            card.classList.add('card-error');
            isValid = false;
            if (!firstErrorElement) firstErrorElement = textarea;
        }
    });

    if (!isValid && firstErrorElement) {
        firstErrorElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const errorMsg = currentLang === 'hi' 
            ? 'कृपया सभी आवश्यक फ़ील्ड भरें, सभी प्रश्नों के उत्तर दें और "ठीक नहीं है" वाले मदों के लिए विवरण लिखें।' 
            : 'Please complete all header fields, make a selection for every checklist item, and provide remarks for items marked "Not OK".';
        alert(errorMsg);
    }

    return isValid;
}

                categoryEn: catEn,
                status: 'CLEAN',
                issueCount: 0,
                items: [],
                itemsEn: [],
                remarks: []
            };
        }

        if (status === 'Not OK') {
            categorizedMap[catEn].status = 'ISSUES';
            categorizedMap[catEn].issueCount += 1;
            if (text) categorizedMap[catEn].items.push(text);
            if (textEn) categorizedMap[catEn].itemsEn.push(textEn);

            exceptionsList.push({
                category: cat,
                categoryEn: catEn,
                item: text,
                itemEn: textEn,
                remark: remark
            });
        }

        if (remark && !categorizedMap[catEn].remarks.includes(remark)) {
            categorizedMap[catEn].remarks.push(remark);
        }
    });

    const categorizedIssues = Object.values(categorizedMap).map(c => ({
        category: c.category,
        categoryEn: c.categoryEn,
        status: c.status,
        issueCount: c.issueCount,
        items: c.items,
        itemsEn: c.itemsEn,
        remarks: c.remarks.join(' | ')
    }));

    if (notOkCards.length > 0) {
        report += `⚠️ *${currentLang === 'hi' ? 'ध्यान देने वाली बातें / कमियां' : 'EXCEPTIONS & REMARKS'} (${notOkCards.length}):*\n\n`;

        const grouped = {};
        notOkCards.forEach(card => {
            const cat = card.getAttribute('data-cat');
            const text = card.getAttribute('data-text');
            const remark = card.querySelector('textarea').value.trim();

            if (!grouped[cat]) grouped[cat] = [];
            grouped[cat].push({ text, remark });
        });

        for (const cat in grouped) {
            report += `📌 *${cat.toUpperCase()}*\n`;
            grouped[cat].forEach(item => {
                report += ` ❌ ${item.text}\n`;
                report += `    ➥ 💬 _${currentLang === 'hi' ? 'विवरण' : 'Remark'}:_ ${item.remark}\n`;
            });
            report += `\n`;
        }
    } else {
        report += currentLang === 'hi' 
            ? `✅ *सब कुछ ठीक पाया गया*\nकोई कमी या समस्या दर्ज नहीं की गई है।\n\n`
            : `✅ *ALL CHECKED ITEMS COMPLIANT*\nNo exceptions or issues noted during Quality Check Sewa.\n\n`;
    }

    if (generalFeedback) {
        report += `━━━━━━━━━━━━━━━━━━━━━━━━━━\n`;
        report += `📝 *${currentLang === 'hi' ? 'सामान्य सुझाव / टिप्पणी' : 'GENERAL FEEDBACK / OBSERVATIONS'}:*\n${generalFeedback}\n\n`;
    }

    // Save Payload to Firestore
    const payload = {
        mode: isVisitMode ? 'visit' : 'regular',
        sewadarName: sewadar,
        canteenNumber: canteen,
        generalFeedback: generalFeedback,
        language: currentLang,
        exceptionsCount: notOkCards.length,
        exceptions: exceptionsList,
        responses: allResponsesList,
        categorizedIssues: categorizedIssues,
        fullReportText: report,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    if (isVisitMode) {
        payload.slot = slot;
    } else {
        payload.dicName = dic;
    }

    db.collection("reports").add(payload)
    .then((docRef) => {
        console.log("Report saved successfully with ID:", docRef.id);
    })
    .catch((error) => {
        console.error("Error saving report to Firestore:", error);
    });

    // Clear saved local draft on successful submission
    localStorage.removeItem(DRAFT_KEY);

    // Lock form to prevent editing/resubmitting
    lockForm(true);
    document.getElementById('draft-status-msg').innerText = UI_TEXT[currentLang].formLockedMsg;

    document.getElementById('report-timestamp').innerText = dateStr;
    document.getElementById('report-text').innerText = report;
    document.getElementById('modal').style.display = 'flex';
}

function setupEventListeners() {
    document.getElementById('generate-btn').addEventListener('click', generateReport);
    document.getElementById('btn-close').addEventListener('click', () => {
        document.getElementById('modal').style.display = 'none';
    });
    
    document.getElementById('btn-copy').addEventListener('click', () => {
        const text = document.getElementById('report-text').innerText;
        navigator.clipboard.writeText(text).then(() => alert(currentLang === 'hi' ? 'रिपोर्ट कॉपी हो गई है!' : 'Report copied to clipboard!'));
    });

    document.getElementById('btn-share-wa').addEventListener('click', () => {
        const text = document.getElementById('report-text').innerText;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    });

    document.getElementById('btn-share-native').addEventListener('click', () => {
        const text = document.getElementById('report-text').innerText;
        if (navigator.share) {
            navigator.share({ title: isVisitMode ? 'QC Visit Report' : 'QC Report', text: text }).catch(() => {});
        } else {
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }
    });

    const canteenInput = document.getElementById('canteen_location');
    if (!isVisitMode && canteenInput) {
        canteenInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '');
            if (e.target.value.trim()) e.target.classList.remove('input-error');
        });
    }

    const clearInputError = (e) => {
        if (e.target.value.trim()) e.target.classList.remove('input-error');
    };

    ['sewadar_name', 'canteen_location', 'slot_selection', 'dic_name'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.addEventListener('input', clearInputError);
            el.addEventListener('change', clearInputError);
        }
    });
}
</script>
</body>
</html>
